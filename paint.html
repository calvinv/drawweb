<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#fdf6ec">
<title>Paint Studio</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; overflow: hidden; overscroll-behavior: none; background: #fdf6ec;
    font-family: "Comic Sans MS", "Chalkboard SE", system-ui, sans-serif; user-select: none; -webkit-user-select: none; color: #333; }
  button { font: inherit; color: inherit; cursor: pointer; }

  #app { height: 100vh; height: 100dvh; display: flex; flex-direction: column;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }

  header { display: flex; gap: 8px; align-items: center; padding: 8px 12px; }
  header .spacer { flex: 1; }
  .hbtn { border: none; background: #fff; border-radius: 14px; padding: 8px 12px; font-size: 20px;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); text-decoration: none; color: inherit; display: inline-flex; align-items: center; gap: 6px; }
  .hbtn:active { transform: scale(.94); }

  #stage { flex: 1; min-height: 0; display: grid; place-items: center; padding: 4px 12px; }
  #board { position: relative; background: #fff; border-radius: 18px; box-shadow: 0 4px 18px rgba(0,0,0,.12); overflow: hidden; }
  #board canvas { position: absolute; inset: 0; width: 100%; height: 100%; touch-action: none; }
  #lines { pointer-events: none; }

  #panel { padding: 8px 12px 12px; display: flex; flex-direction: column; gap: 10px; }
  .row { display: flex; gap: 8px; align-items: center; justify-content: center; }

  .tool, .size { border: none; background: #fff; border-radius: 999px; padding: 8px 14px; font-size: 18px; box-shadow: 0 2px 6px rgba(0,0,0,.1); }
  .tool.on, .size.on { background: #333; color: #fff; }
  .size { width: 42px; height: 42px; padding: 0; display: grid; place-items: center; }
  .size i { display: block; background: currentColor; border-radius: 50%; }

  /* palette */
  .palrow { position: relative; justify-content: center; }
  #palette { display: block; touch-action: none; }
  .side { position: absolute; top: 0; display: flex; flex-direction: column; gap: 8px; }
  .side.left { left: 0; } .side.right { right: 0; }
  .round { border: none; background: #fff; border-radius: 50%; width: 46px; height: 46px; font-size: 22px; padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.12); display: grid; place-items: center; }
  .round:active { transform: scale(.9); }
  #brushChip svg { width: 40px; height: 40px; }
  #brushChip.shake { animation: shake .4s; }
  #recent { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 34px; flex-wrap: wrap; }
  #recent:empty { display: none; }
  #recent .lbl { font-size: 14px; color: #8a6a48; }
  .swatch { width: 34px; height: 34px; border-radius: 50%; border: 3px solid #fff; padding: 0;
    box-shadow: 0 2px 6px rgba(0,0,0,.18); }
  .swatch.on { outline: 3px solid #333; outline-offset: 1px; }
  .swatch:active { transform: scale(.9); }
  @keyframes shake { 25% { transform: translateX(-6px) rotate(-8deg); } 75% { transform: translateX(6px) rotate(8deg); } }

  /* picture picker */
  #picker { position: fixed; inset: 0; background: rgba(253,246,236,.97); z-index: 20; display: flex; flex-direction: column;
    padding: calc(env(safe-area-inset-top) + 12px) 16px 16px; }
  #picker[hidden] { display: none; }
  #picker h2 { margin: 0 0 12px; display: flex; justify-content: space-between; align-items: center; font-size: 22px; }
  #grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 12px; overflow-y: auto; padding-bottom: 12px; }
  .pic { background: #fff; border: none; border-radius: 16px; padding: 10px 10px 6px; box-shadow: 0 2px 8px rgba(0,0,0,.1); display: flex; flex-direction: column; align-items: center; gap: 4px; font-size: 15px; }
  .pic svg { width: 100%; height: auto; aspect-ratio: 1; }
  .pic.on { outline: 4px solid #333; }

  /* sideways phone / tablet / desktop: panel goes on the right */
  @media (orientation: landscape) and (min-width: 560px) {
    #app { display: grid; grid-template-columns: 1fr auto; grid-template-rows: auto 1fr; }
    header { grid-column: 1 / 3; }
    #stage { grid-row: 2; }
    #panel { grid-row: 2; grid-column: 2; width: 400px; justify-content: center; }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <a class="hbtn" href="index.html" title="Drawing page">🏠</a>
    <button class="hbtn" id="pickBtn">🖼️ <span id="picName">Pictures</span></button>
    <span class="spacer"></span>
    <button class="hbtn" id="undo" title="Undo">↩️</button>
    <button class="hbtn" id="save" title="Save picture">💾</button>
  </header>

  <main id="stage">
    <div id="board">
      <canvas id="color"></canvas>
      <canvas id="lines"></canvas>
    </div>
  </main>

  <section id="panel">
    <div class="row">
      <button class="tool on" data-tool="fill">🪣 Fill</button>
      <button class="tool" data-tool="brush">🖌️ Brush</button>
      <button class="size" data-size="6"><i style="width:6px;height:6px"></i></button>
      <button class="size on" data-size="14"><i style="width:12px;height:12px"></i></button>
      <button class="size" data-size="30"><i style="width:20px;height:20px"></i></button>
    </div>
    <div class="row palrow" id="palrow">
      <div class="side left">
        <button class="round" id="brushChip" title="Your brush">
          <svg viewBox="0 0 40 40"><g stroke="#333" stroke-width="2" stroke-linejoin="round">
            <path d="M24 18 L36 4 L38 6 L26 20 Z" fill="#c8874b"/>
            <path d="M20 16 L24 18 L26 20 L24 24 L18 22 Z" fill="#bbb"/>
            <path id="tip" d="M18 22 L24 24 C22 32 14 36 4 37 C8 31 9 25 18 22 Z" fill="#fff" stroke-dasharray="3 2"/>
          </g></svg>
        </button>
        <button class="round" id="wash" title="Wash the brush">🫙</button>
      </div>
      <canvas id="palette"></canvas>
      <div class="side right">
        <button class="round" id="wipe" title="Wipe the palette">🧽</button>
      </div>
    </div>
    <div class="row" id="recent"></div>
  </section>
</div>

<div id="picker" hidden>
  <h2>Pick a picture <button class="hbtn" id="closePicker">✖️</button></h2>
  <div id="grid"></div>
</div>

<script>
// ================= pictures (400x400 line art; every shape is closed so Fill works) =================
function starPts(cx, cy, R, r, n = 5) {
  const pts = [];
  for (let i = 0; i < n * 2; i++) {
    const a = -Math.PI / 2 + i * Math.PI / n, rr = i % 2 ? r : R;
    pts.push((cx + Math.cos(a) * rr).toFixed(1) + ',' + (cy + Math.sin(a) * rr).toFixed(1));
  }
  return `<polygon points="${pts.join(' ')}"/>`;
}
function flowerHead(cx, cy, r, n = 7) {
  let d = '';
  const chord = 2 * r * Math.sin(Math.PI / n), pr = chord * 0.62;
  for (let i = 0; i <= n; i++) {
    const a = i * 2 * Math.PI / n - Math.PI / 2;
    const x = (cx + Math.cos(a) * r).toFixed(1), y = (cy + Math.sin(a) * r).toFixed(1);
    d += i === 0 ? `M${x} ${y}` : ` A${pr.toFixed(1)} ${pr.toFixed(1)} 0 0 1 ${x} ${y}`;
  }
  return `<path d="${d}Z"/><circle cx="${cx}" cy="${cy}" r="${(r * 0.4).toFixed(1)}"/>`;
}
function rays(cx, cy, r1, r2, n) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    s += `<path d="M${(cx + Math.cos(a) * r1).toFixed(1)} ${(cy + Math.sin(a) * r1).toFixed(1)} L${(cx + Math.cos(a) * r2).toFixed(1)} ${(cy + Math.sin(a) * r2).toFixed(1)}"/>`;
  }
  return s;
}

const VASE_BODY = 'M175 150 C100 190 90 290 140 340 L260 340 C310 290 300 190 225 150 Z';
const SHOE_BODY = 'M60 300 L60 205 C60 188 78 180 98 186 L165 205 C185 165 215 145 248 152 L278 170 C318 198 352 232 352 272 L352 300 Z';
const SHOE_SOLE = 'M48 300 L362 300 L362 318 Q362 336 344 336 L66 336 Q48 336 48 318 Z';
const FISH_BODY = 'M90 200 C130 130 250 120 300 200 C250 280 130 270 90 200 Z';
const CAR_BODY = 'M50 290 L50 240 Q50 225 70 222 L120 218 L155 165 Q162 155 178 155 L262 155 Q278 155 288 168 L322 218 L350 225 Q365 230 365 248 L365 290 Z';
const WRAPPER = 'M120 230 L280 230 L260 350 L140 350 Z';
const LWING = '<path d="M195 175 C150 85 65 90 72 150 C78 205 150 215 195 205 Z"/><path d="M195 215 C140 218 98 258 116 300 C136 336 186 292 195 245 Z"/><circle cx="128" cy="150" r="20"/><circle cx="155" cy="182" r="9"/><circle cx="146" cy="270" r="13"/>';

const PICTURES = {

    ${flowerHead(150, 45, 24)}${flowerHead(200, 25, 24, 8)}${flowerHead(255, 50, 24, 6)}
    <path d="${VASE_BODY}"/>
    <g clip-path="url(#vaseC)">
      <path d="M80 222 Q105 200 130 222 T180 222 T230 222 T280 222 T330 222"/>
      <path d="M80 283 L330 283"/><path d="M80 305 L330 305"/>
      <circle cx="160" cy="254" r="10"/><circle cx="200" cy="254" r="10"/><circle cx="240" cy="254" r="10"/>
    </g>
    <rect x="160" y="128" width="80" height="22" rx="6"/>` },

  shoe: { name: 'Shoe', svg: `
    <defs><clipPath id="shoeC"><path d="${SHOE_BODY}"/></clipPath><clipPath id="soleC"><path d="${SHOE_SOLE}"/></clipPath></defs>
    <path d="${SHOE_BODY}"/>
    <g clip-path="url(#shoeC)">
      <path d="M290 300 C292 255 315 232 360 240"/>
      <path d="M40 228 C90 214 120 222 150 238"/>
      <path d="M165 205 C190 232 235 222 265 160"/>
      ${starPts(118, 258, 26, 11)}
    </g>
    <path d="M185 212 L222 196"/><path d="M198 198 L236 182"/><path d="M212 184 L250 170"/>
    <path d="${SHOE_SOLE}"/>
    <g clip-path="url(#soleC)"><path d="M40 318 L370 318"/></g>` },

  house: { name: 'House', svg: `
    <path d="M20 340 L380 340"/>
    <path d="M245 134.4 L245 112 L277 112 L277 162.4"/>
    <polygon points="80,200 200,95 320,200"/>
    <rect x="100" y="200" width="200" height="140"/>
    <circle cx="200" cy="160" r="16"/>
    <rect x="180" y="270" width="40" height="70" rx="4"/><circle cx="210" cy="305" r="4"/>
    <rect x="118" y="225" width="45" height="40"/><path d="M140.5 225 V265 M118 245 H163"/>
    <rect x="237" y="225" width="45" height="40"/><path d="M259.5 225 V265 M237 245 H282"/>
    <circle cx="340" cy="60" r="26"/>${rays(340, 60, 34, 46, 8)}
    <path d="M45 100 Q30 100 32 85 Q34 70 52 72 Q58 52 82 56 Q100 50 108 68 Q128 70 126 88 Q124 100 108 100 Z"/>
    ${flowerHead(50, 315, 14, 6)}<path d="M50 329 L50 340"/>
    ${flowerHead(345, 315, 14, 5)}<path d="M345 329 L345 340"/>` },

  fish: { name: 'Fish', svg: `
    <defs><clipPath id="fishC"><path d="${FISH_BODY}"/></clipPath></defs>
    <path d="M0 370 Q100 352 200 370 T400 370"/>
    <path d="M40 368 Q22 335 40 300 Q58 265 40 232"/><path d="M360 372 Q378 340 360 310 Q345 285 362 262"/>
    <path d="M160 162 Q195 92 258 150 Z"/><path d="M168 240 Q186 292 225 255 Z"/>
    <path d="M300 200 L362 148 L346 200 L362 252 Z"/>
    <path d="${FISH_BODY}"/>
    <g clip-path="url(#fishC)">
      <path d="M165 150 Q190 200 165 250"/>
      <path d="M212 130 Q228 200 212 270"/><path d="M252 135 Q265 200 252 265"/>
    </g>
    <circle cx="132" cy="186" r="13"/><circle cx="135" cy="186" r="5"/>
    <path d="M94 206 Q102 214 112 209"/>
    <circle cx="62" cy="150" r="8"/><circle cx="48" cy="112" r="12"/><circle cx="70" cy="76" r="6"/>` },

  butterfly: { name: 'Butterfly', svg: `
    ${LWING}
    <g transform="translate(400 0) scale(-1 1)">${LWING}</g>
    <path d="M194 145 Q180 98 158 92"/><path d="M206 145 Q220 98 242 92"/>
    <circle cx="154" cy="90" r="6"/><circle cx="246" cy="90" r="6"/>
    <ellipse cx="200" cy="215" rx="12" ry="68"/>
    <circle cx="200" cy="146" r="14"/>` },

  cupcake: { name: 'Cupcake', svg: `
    <defs><clipPath id="cupC"><path d="${WRAPPER}"/></clipPath></defs>
    <path d="M60 350 L340 350"/>
    <path d="${WRAPPER}"/>
    <g clip-path="url(#cupC)">
      <path d="M150 230 L158 350 M175 230 L179 350 M200 230 L200 350 M225 230 L221 350 M250 230 L242 350"/>
    </g>
    <path d="M110 230 Q95 200 125 190 Q120 150 160 150 Q170 115 200 118 Q235 112 240 150 Q280 150 275 190 Q305 200 290 230 Z"/>
    <path d="M128 208 Q170 222 200 205 Q235 222 272 208"/>
    <path d="M160 175 L170 168 M205 160 L215 165 M240 180 L248 172 M180 192 L188 198 M225 195 L233 190"/>
    <path d="M200 84 Q205 62 224 52"/>
    <circle cx="200" cy="102" r="18"/>` },

  cat: { name: 'Cat', svg: `
    <path d="M110 170 L105 70 L175 120"/><path d="M290 170 L295 70 L225 120"/>
    <path d="M125 140 L122 98 L156 122 Z"/><path d="M275 140 L278 98 L244 122 Z"/>
    <circle cx="200" cy="220" r="110"/>
    <ellipse cx="160" cy="205" rx="20" ry="26"/><ellipse cx="160" cy="207" rx="7" ry="15"/>
    <ellipse cx="240" cy="205" rx="20" ry="26"/><ellipse cx="240" cy="207" rx="7" ry="15"/>
    <path d="M186 250 L214 250 L200 265 Z"/>
    <path d="M200 265 Q200 282 180 284 M200 265 Q200 282 220 284"/>
    <path d="M170 262 L70 248 M170 270 L72 280 M230 262 L330 248 M230 270 L328 280"/>
    <path d="M150 318 Q200 345 250 318"/>${starPts(200, 345, 14, 6)}` },

  car: { name: 'Car', svg: `
    <defs><clipPath id="carC"><path d="${CAR_BODY}"/></clipPath></defs>
    <path d="M10 327 L390 327"/>
    <path d="${CAR_BODY}"/>
    <g clip-path="url(#carC)"><path d="M222 150 L222 300"/><path d="M40 258 L380 258"/></g>
    <path d="M165 215 L180 172 L215 172 L215 215 Z"/>
    <path d="M230 215 L230 172 L265 172 L298 215 Z"/>
    <path d="M240 236 L258 236"/>
    <circle cx="352" cy="242" r="8"/><rect x="50" y="234" width="12" height="16" rx="3"/>
    <circle cx="120" cy="295" r="32"/><circle cx="120" cy="295" r="13"/>
    <circle cx="300" cy="295" r="32"/><circle cx="300" cy="295" r="13"/>` },

  blank: { name: 'Blank', svg: '' },
};

const svgDoc = (body, size) =>
  `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400"${size ? ` width="${size}" height="${size}"` : ''}>` +
  `<g fill="none" stroke="#222" stroke-width="5" stroke-linejoin="round" stroke-linecap="round">${body}</g></svg>`;

// ================= palette: real-ish paint mixing with a brush =================
// Colours mix like paint (geometric mean in linear light), so yellow + blue = green.
const toLin = c => { c /= 255; return c <= 0.04045 ? c / 12.92 : ((c + 0.055) / 1.055) ** 2.4; };
const toSrgb = l => { const c = l <= 0.0031308 ? l * 12.92 : 1.055 * l ** (1 / 2.4) - 0.055; return Math.round(Math.min(1, Math.max(0, c)) * 255); };
const hex = rgb => '#' + rgb.map(v => v.toString(16).padStart(2, '0')).join('');
const LOG = new Float32Array(256).map((_, v) => Math.log(Math.max(0.002, toLin(v))));
const fromLog = x => toSrgb(Math.exp(x));

const PAINTS = [   // x, y as fractions of the palette size, round the rim like a real palette
  { name: 'Black',  rgb: [58, 58, 58],    x: 0.28, y: 0.80 },
  { name: 'White',  rgb: [255, 255, 255], x: 0.15, y: 0.59 },
  { name: 'Red',    rgb: [215, 30, 70],   x: 0.17, y: 0.37 },
  { name: 'Orange', rgb: [245, 130, 30],  x: 0.30, y: 0.24 },
  { name: 'Yellow', rgb: [250, 215, 30],  x: 0.43, y: 0.20 },
  { name: 'Green',  rgb: [40, 170, 70],   x: 0.57, y: 0.20 },
  { name: 'Blue',   rgb: [20, 100, 210],  x: 0.70, y: 0.24 },
  { name: 'Purple', rgb: [135, 60, 185],  x: 0.83, y: 0.37 },
];

// colour on the brush, as [logR, logG, logB]; null = clean brush. Starts with red so the first tap just works.
let brush = PAINTS[2].rgb.map(v => LOG[v]);
const sameRGB = (a, b) => a && b && a[0] === b[0] && a[1] === b[1] && a[2] === b[2];
const brushRGB = () => brush && brush.map(fromLog);
const tipEl = document.getElementById('tip'), chip = document.getElementById('brushChip');
function showBrush() {
  const c = brushRGB();
  tipEl.setAttribute('fill', c ? hex(c) : '#fff');
  tipEl.setAttribute('stroke-dasharray', c ? '' : '3 2');
  recentEl.querySelectorAll('.swatch').forEach(b => b.classList.toggle('on', !!c && b.dataset.c === hex(c)));
}

// recently used colours, so a mixed colour is easy to get back
const recentEl = document.getElementById('recent');
let recent = [];
function rememberColour(rgb) {
  const h = hex(rgb);
  if (recent[0] === h) return;
  recent = [h, ...recent.filter(x => x !== h)].slice(0, 7);
  recentEl.innerHTML = '<span class="lbl">Used:</span>' + recent.map(c =>
    `<button class="swatch" data-c="${c}" style="background:${c}" title="Use this colour again"></button>`).join('');
  showBrush();
}
recentEl.addEventListener('click', e => {
  const c = e.target.dataset && e.target.dataset.c; if (!c) return;
  brush = [1, 3, 5].map(i => LOG[parseInt(c.slice(i, i + 2), 16)]);
  showBrush(); renderPalette();
});
function nudgeBrush() { chip.classList.remove('shake'); void chip.offsetWidth; chip.classList.add('shake'); }
document.getElementById('wash').onclick = () => { brush = null; showBrush(); renderPalette(); };

const palC = document.getElementById('palette'), palrow = document.getElementById('palrow');
const pctx = palC.getContext('2d');
const mixC = document.createElement('canvas'), mctx = mixC.getContext('2d', { willReadFrequently: true });
let PW = 0, PH = 0, pScale = 1, mixData = null, mask = null, mixUsed = false;

function palettePath(ctx) {
  ctx.beginPath();
  ctx.ellipse(PW * 0.5, PH * 0.53, PW * 0.48, PH * 0.45, 0, 0, Math.PI * 2);
  ctx.moveTo(PW * 0.86 + PH * 0.09, PH * 0.68);
  ctx.arc(PW * 0.86, PH * 0.68, PH * 0.09, 0, Math.PI * 2);   // thumb hole
}
const wellR = () => PH * 0.1;

function layoutPalette() {
  const avail = palrow.clientWidth - 2 * 54;          // room for the side buttons
  const portrait = !matchMedia('(orientation: landscape) and (min-width: 560px)').matches;
  let w = Math.max(160, Math.min(avail, 440));
  const maxH = portrait ? Math.round(innerHeight * 0.26) : 9999;
  if (w * 0.6 > maxH) w = Math.round(maxH / 0.6);
  const h = Math.round(w * 0.6);
  const dpr = Math.min(2, window.devicePixelRatio || 1);
  const nw = Math.round(w * dpr), nh = Math.round(h * dpr);
  if (nw === PW && nh === PH) return;
  palC.style.width = w + 'px'; palC.style.height = h + 'px';
  palrow.style.minHeight = h + 'px';
  // keep whatever was mixed when the size changes
  const old = document.createElement('canvas');
  old.width = mixC.width; old.height = mixC.height;
  if (PW) old.getContext('2d').drawImage(mixC, 0, 0);
  PW = palC.width = mixC.width = nw; PH = palC.height = mixC.height = nh;
  pScale = nw / w;
  if (old.width) mctx.drawImage(old, 0, 0, PW, PH);
  mixData = mctx.getImageData(0, 0, PW, PH);
  const t = document.createElement('canvas'); t.width = PW; t.height = PH;
  const tc = t.getContext('2d'); palettePath(tc); tc.fill('evenodd');
  const md = tc.getImageData(0, 0, PW, PH).data;
  mask = new Uint8Array(PW * PH);
  for (let i = 0; i < mask.length; i++) mask[i] = md[i * 4 + 3] > 128 ? 1 : 0;
  renderPalette();
}

function renderPalette() {
  const s = pScale;
  pctx.clearRect(0, 0, PW, PH);
  // wooden board
  pctx.save();
  pctx.shadowColor = 'rgba(0,0,0,.25)'; pctx.shadowBlur = 8 * s; pctx.shadowOffsetY = 3 * s;
  palettePath(pctx); pctx.fillStyle = '#e6c08f'; pctx.fill('evenodd');
  pctx.restore();
  pctx.save();
  palettePath(pctx); pctx.clip('evenodd');
  pctx.strokeStyle = 'rgba(160,110,60,.18)'; pctx.lineWidth = 2 * s;
  for (let i = 0; i < 6; i++) {
    pctx.beginPath();
    pctx.ellipse(PW * 0.35, PH * 1.3, PW * (0.3 + i * 0.12), PH * (0.5 + i * 0.16), 0, Math.PI, 2 * Math.PI);
    pctx.stroke();
  }
  pctx.drawImage(mixC, 0, 0);
  pctx.restore();
  palettePath(pctx); pctx.strokeStyle = '#b4834f'; pctx.lineWidth = 2.5 * s; pctx.stroke();
  // paint blobs
  const r = wellR(), cur = brushRGB();
  for (const p of PAINTS) {
    const x = p.x * PW, y = p.y * PH;
    pctx.beginPath(); pctx.ellipse(x + r * 0.08, y + r * 0.14, r, r * 0.92, 0, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(0,0,0,.18)'; pctx.fill();
    pctx.beginPath(); pctx.ellipse(x, y, r, r * 0.9, 0, 0, Math.PI * 2);
    pctx.fillStyle = hex(p.rgb); pctx.fill();
    if (p.name === 'White') { pctx.strokeStyle = '#d8d0c4'; pctx.lineWidth = 1.5 * s; pctx.stroke(); }
    pctx.beginPath(); pctx.ellipse(x - r * 0.35, y - r * 0.35, r * 0.28, r * 0.17, -0.6, 0, Math.PI * 2);
    pctx.fillStyle = 'rgba(255,255,255,.55)'; pctx.fill();
    if (sameRGB(cur, p.rgb)) {      // ring round the paint that's on the brush
      pctx.beginPath(); pctx.ellipse(x, y, r * 1.28, r * 1.18, 0, 0, Math.PI * 2);
      pctx.strokeStyle = '#333'; pctx.lineWidth = 3 * s; pctx.stroke();
    }
  }
  if (!mixUsed) {
    pctx.fillStyle = 'rgba(120,80,40,.55)';
    pctx.font = `${Math.round(PH * 0.075)}px "Comic Sans MS", system-ui, sans-serif`;
    pctx.textAlign = 'center';
    pctx.fillText('Tap a paint to use it,', PW * 0.56, PH * 0.52);
    pctx.fillText('or swirl here to mix!', PW * 0.56, PH * 0.62);
  }
}

function wellAt(x, y) {
  const r = wellR() * 1.35;     // generous target for little fingers; nearest blob wins
  let best = null, bd = r * r;
  for (const p of PAINTS) { const d = (x - p.x * PW) ** 2 + (y - p.y * PH) ** 2; if (d < bd) { bd = d; best = p; } }
  return best;
}

// One touch of the brush on the palette: pick up some of what's there, leave some of what's on the brush.
function dab(cx, cy, pick) {
  const w = wellAt(cx, cy);
  if (w) { brush = w.rgb.map(v => LOG[v]); showBrush(); return; }   // dip into a paint blob
  const r = 13 * pScale, r2 = r * r, d = mixData.data;
  const x0 = Math.max(0, Math.floor(cx - r)), x1 = Math.min(PW - 1, Math.ceil(cx + r));
  const y0 = Math.max(0, Math.floor(cy - r)), y1 = Math.min(PH - 1, Math.ceil(cy + r));
  if (x0 > x1 || y0 > y1) return;
  let tot = 0, n = 0; const sum = [0, 0, 0];
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    if ((x - cx) ** 2 + (y - cy) ** 2 > r2) continue;
    const p = y * PW + x; if (!mask[p]) continue;
    tot++;
    const i = p * 4;
    if (d[i + 3] > 128) { n++; sum[0] += LOG[d[i]]; sum[1] += LOG[d[i + 1]]; sum[2] += LOG[d[i + 2]]; }
  }
  if (!tot) return;
  if (n) {
    const avg = sum.map(v => v / n), k = pick * n / tot;
    brush = brush ? brush.map((b, j) => b + (avg[j] - b) * k) : avg;
    showBrush();
  }
  if (!brush) return;
  const bc = brush.map(fromLog);
  for (let y = y0; y <= y1; y++) for (let x = x0; x <= x1; x++) {
    const dd = (x - cx) ** 2 + (y - cy) ** 2; if (dd > r2) continue;
    const p = y * PW + x; if (!mask[p]) continue;
    const fall = 1 - Math.sqrt(dd) / r, i = p * 4;
    const edgeA = Math.min(255, fall * 4 * 255);
    if (d[i + 3] < 10) { d[i] = bc[0]; d[i + 1] = bc[1]; d[i + 2] = bc[2]; d[i + 3] = edgeA; continue; }
    const t = 0.3 * Math.min(1, fall * 1.6);
    for (let k = 0; k < 3; k++) d[i + k] = fromLog(LOG[d[i + k]] + (brush[k] - LOG[d[i + k]]) * t);
    d[i + 3] = Math.max(d[i + 3], edgeA);
  }
  mctx.putImageData(mixData, 0, 0, x0, y0, x1 - x0 + 1, y1 - y0 + 1);
  mixUsed = true;
}

let palLast = null;
const palPoint = e => { const r = palC.getBoundingClientRect(); return { x: (e.clientX - r.left) * PW / r.width, y: (e.clientY - r.top) * PH / r.height }; };
palC.addEventListener('pointerdown', e => {
  e.preventDefault();
  palC.setPointerCapture(e.pointerId);
  palLast = palPoint(e);
  dab(palLast.x, palLast.y, 0.75);     // a tap picks up the colour under the brush
  renderPalette();
});
palC.addEventListener('pointermove', e => {
  if (!palLast) return;
  const p = palPoint(e), dist = Math.hypot(p.x - palLast.x, p.y - palLast.y);
  const steps = Math.max(1, Math.ceil(dist / (4 * pScale)));
  for (let i = 1; i <= steps; i++)
    dab(palLast.x + (p.x - palLast.x) * i / steps, palLast.y + (p.y - palLast.y) * i / steps, 0.12);
  palLast = p;
  renderPalette();
});
const palStop = () => palLast = null;
palC.addEventListener('pointerup', palStop);
palC.addEventListener('pointercancel', palStop);
document.getElementById('wipe').onclick = () => {
  mixData = new ImageData(PW, PH); mctx.clearRect(0, 0, PW, PH); renderPalette();
};
showBrush();

// ================= canvases =================
const board = document.getElementById('board'), stage = document.getElementById('stage');
const colorC = document.getElementById('color'), linesC = document.getElementById('lines');
const cctx = colorC.getContext('2d', { willReadFrequently: true });
const lctx = linesC.getContext('2d', { willReadFrequently: true });
let side = 0, W = 0, H = 0, walls = null, current = 'vase', renderToken = 0;
const saved = {};      // per-picture painting, so switching pictures doesn't lose work
let undoStack = [];

function layout() {
  const r = stage.getBoundingClientRect();
  const s = Math.floor(Math.max(120, Math.min(r.width - 24, r.height - 8)));
  if (s === side) return;
  side = s;
  board.style.width = board.style.height = s + 'px';
  const px = Math.round(s * Math.min(2, window.devicePixelRatio || 1));
  // keep the painting through rotations/resizes
  const old = document.createElement('canvas');
  old.width = colorC.width; old.height = colorC.height;
  if (W) old.getContext('2d').drawImage(colorC, 0, 0);
  W = H = px;
  colorC.width = linesC.width = px; colorC.height = linesC.height = px;
  if (old.width) cctx.drawImage(old, 0, 0, px, px);
  undoStack = [];
  renderLines();
}

function renderLines() {
  const token = ++renderToken;
  const img = new Image();
  img.onload = () => {
    if (token !== renderToken) return;
    lctx.clearRect(0, 0, W, H);
    lctx.drawImage(img, 0, 0, W, H);
    const d = lctx.getImageData(0, 0, W, H).data;
    walls = new Uint8Array(W * H);
    for (let i = 0; i < W * H; i++) walls[i] = d[i * 4 + 3] > 80 ? 1 : 0;
  };
  img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgDoc(PICTURES[current].svg, W));
}

function pushUndo() {
  undoStack.push(cctx.getImageData(0, 0, W, H));
  if (undoStack.length > 10) undoStack.shift();
}
document.getElementById('undo').onclick = () => {
  const img = undoStack.pop();
  if (img) cctx.putImageData(img, 0, 0);
};

// ================= tools =================
let tool = 'fill', size = 14;
document.querySelectorAll('.tool').forEach(b => b.onclick = () => {
  document.querySelectorAll('.tool').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); tool = b.dataset.tool;
});
document.querySelectorAll('.size').forEach(b => b.onclick = () => {
  document.querySelectorAll('.size').forEach(x => x.classList.remove('on'));
  b.classList.add('on'); size = +b.dataset.size;
  if (tool !== 'brush') document.querySelector('[data-tool=brush]').click();
});

function canvasPoint(e) {
  const r = colorC.getBoundingClientRect();
  return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
}

let drawing = false, last = null, strokeRGB = null;
colorC.addEventListener('pointerdown', e => {
  e.preventDefault();
  const rgb = brushRGB();
  if (!rgb) { nudgeBrush(); return; }   // clean brush: dip it in paint first
  const p = canvasPoint(e);
  rememberColour(rgb);
  if (tool === 'fill') { fillAt(Math.floor(p.x), Math.floor(p.y), rgb); return; }
  pushUndo();
  drawing = true; last = p; strokeRGB = rgb;
  colorC.setPointerCapture(e.pointerId);
  const s = size * W / side;
  cctx.fillStyle = hex(rgb);
  cctx.beginPath(); cctx.arc(p.x, p.y, s / 2, 0, Math.PI * 2); cctx.fill();
});
colorC.addEventListener('pointermove', e => {
  if (!drawing) return;
  const p = canvasPoint(e);
  cctx.strokeStyle = hex(strokeRGB);
  cctx.lineWidth = size * W / side;
  cctx.lineCap = cctx.lineJoin = 'round';
  cctx.beginPath(); cctx.moveTo(last.x, last.y); cctx.lineTo(p.x, p.y); cctx.stroke();
  last = p;
});
const stop = () => drawing = false;
colorC.addEventListener('pointerup', stop);
colorC.addEventListener('pointercancel', stop);

// Fill: the region is decided by the black outlines only, so tapping again re-colours it.
function fillAt(sx, sy, rgb) {
  if (!walls || sx < 0 || sy < 0 || sx >= W || sy >= H) return;
  // tapped right on a line? nudge to the nearest open spot
  let start = sy * W + sx;
  if (walls[start]) {
    start = -1;
    for (let rad = 1; rad <= 8 && start < 0; rad++)
      for (let dy = -rad; dy <= rad && start < 0; dy++)
        for (let dx = -rad; dx <= rad; dx++) {
          const x = sx + dx, y = sy + dy;
          if (x >= 0 && y >= 0 && x < W && y < H && !walls[y * W + x]) { start = y * W + x; break; }
        }
    if (start < 0) return;
  }
  pushUndo();
  const region = new Uint8Array(W * H), list = [];
  const open = p => !walls[p] && !region[p];
  const stack = [start % W, Math.floor(start / W)];
  while (stack.length) {
    const y = stack.pop(); let x = stack.pop(), p = y * W + x;
    while (x > 0 && open(p - 1)) { x--; p--; }
    let up = false, down = false;
    for (; x < W && open(p); x++, p++) {
      region[p] = 1; list.push(p);
      if (y > 0) { const ok = open(p - W); if (ok && !up) stack.push(x, y - 1); up = ok; }
      if (y < H - 1) { const ok = open(p + W); if (ok && !down) stack.push(x, y + 1); down = ok; }
    }
  }
  const img = cctx.getImageData(0, 0, W, H), d = img.data;
  const [r, g, b] = rgb;
  const put = p => { const i = p * 4; d[i] = r; d[i + 1] = g; d[i + 2] = b; d[i + 3] = 255; };
  const R = 3; // also paint a little way under the lines so there's no white gap
  for (const p of list) {
    put(p);
    const x = p % W, y = (p - x) / W;
    const edge = x === 0 || x === W - 1 || y === 0 || y === H - 1 ||
      !region[p - 1] || !region[p + 1] || !region[p - W] || !region[p + W];
    if (!edge) continue;
    for (let dy = -R; dy <= R; dy++) for (let dx = -R; dx <= R; dx++) {
      const xx = x + dx, yy = y + dy;
      if (xx >= 0 && yy >= 0 && xx < W && yy < H && walls[yy * W + xx]) put(yy * W + xx);
    }
  }
  cctx.putImageData(img, 0, 0);
}

// ================= picture picker =================
const picker = document.getElementById('picker'), grid = document.getElementById('grid');
for (const [key, pic] of Object.entries(PICTURES)) {
  const b = document.createElement('button');
  b.className = 'pic'; b.dataset.key = key;
  b.innerHTML = svgDoc(pic.svg) + `<span>${pic.name}</span>`;
  b.onclick = () => { choose(key); picker.hidden = true; };
  grid.appendChild(b);
}
document.getElementById('pickBtn').onclick = () => {
  grid.querySelectorAll('.pic').forEach(b => b.classList.toggle('on', b.dataset.key === current));
  picker.hidden = false;
};
document.getElementById('closePicker').onclick = () => picker.hidden = true;

function choose(key) {
  if (key === current) return;
  const keep = document.createElement('canvas');
  keep.width = W; keep.height = H; keep.getContext('2d').drawImage(colorC, 0, 0);
  saved[current] = keep;
  current = key;
  cctx.clearRect(0, 0, W, H);
  if (saved[key]) cctx.drawImage(saved[key], 0, 0, W, H);
  undoStack = [];
  document.getElementById('picName').textContent = PICTURES[key].name;
  renderLines();
}

// ================= save =================
document.getElementById('save').onclick = () => {
  const out = document.createElement('canvas');
  out.width = W; out.height = H;
  const o = out.getContext('2d');
  o.fillStyle = '#fff'; o.fillRect(0, 0, W, H);
  o.drawImage(colorC, 0, 0); o.drawImage(linesC, 0, 0);
  if (window.ReactNativeWebView) { // running inside the phone app: let the app save/share it
    window.ReactNativeWebView.postMessage(JSON.stringify({ type: 'save', name: `my-${current}.png`, data: out.toDataURL('image/png') }));
    return;
  }
  out.toBlob(async blob => {
    const name = `my-${current}.png`;
    const file = new File([blob], name, { type: 'image/png' });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      try { await navigator.share({ files: [file], title: 'My painting' }); return; } catch (e) { if (e.name === 'AbortError') return; }
    }
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob); a.download = name; a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  }, 'image/png');
};

// ================= go =================
document.getElementById('picName').textContent = PICTURES[current].name;
addEventListener('resize', () => { layoutPalette(); layout(); });
new ResizeObserver(layout).observe(stage);
layoutPalette();
layout();
document.addEventListener('gesturestart', e => e.preventDefault()); // stop pinch-zoom on iOS
</script>
</body>
</html>
